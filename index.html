<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Art Educator Career Guidance Survey</title>

    href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23C2874F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><polyline points="9 14 11 16 15 11"></polyline></svg>'
    type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* ── Custom Tokens ───────────────────────────────────────────── */
    :root {
      --stone: #FAFAF8;
      --cream: #F4F1EC;
      --sand: #E8E2D9;
      --amber: #C2874F;
      --amber-lt: #F0DEC8;
      --charcoal: #18181B;
      --ink: #3F3F46;
      --muted: #71717A;
      --border: #E4E4E7;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.07), 0 4px 16px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 4px 24px rgba(0, 0, 0, 0.10);
    }

    /* ── Base Reset ───────────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Screen Transitions ───────────────────────────────────────── */
    .screen {
      animation: fadeSlideIn 0.35s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Card ─────────────────────────────────────────────────────── */
    .card {
      background: var(--stone);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    /* ── Action Bar Pill ──────────────────────────────────────────── */
    .action-bar {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: rgba(250, 250, 248, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 6px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
    }

    .ab-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.02em;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .ab-btn:hover {
      background: var(--sand);
    }

    .ab-btn.active {
      background: var(--charcoal);
      color: #fff;
    }

    .ab-divider {
      width: 1px;
      height: 18px;
      background: var(--border);
      margin: 0 2px;
    }

    /* ── Tooltip (Mobile Optimized) ───────────────────────────────── */
    .tooltip-wrap {
      position: relative;
    }

    .tooltip-box {
      position: absolute;
      bottom: calc(100% + 10px);
      right: -8px;
      left: auto;
      transform: scale(0.95);
      transform-origin: bottom right;
      background: var(--charcoal);
      color: #fff;
      font-size: 13px;
      line-height: 1.5;
      padding: 12px 16px;
      border-radius: 12px;
      width: 260px;
      max-width: 85vw;
      text-align: left;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
      z-index: 50;
      box-shadow: var(--shadow-lg);
    }

    .tooltip-box::after {
      content: '';
      position: absolute;
      top: 100%;
      right: 18px;
      left: auto;
      border: 6px solid transparent;
      border-top-color: var(--charcoal);
    }

    .tooltip-wrap:hover .tooltip-box,
    .tooltip-wrap.active .tooltip-box {
      opacity: 1;
      transform: scale(1);
    }

    /* ── Full-Width Interactive Cards (Radio & Checkbox) ──────────── */
    .msq-card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      cursor: pointer;
      background: var(--stone);
      transition: border-color 0.18s, background 0.18s, transform 0.1s;
      font-size: 14px;
      color: var(--ink);
      line-height: 1.45;
    }

    .msq-card:hover {
      border-color: var(--amber);
    }

    .msq-card.selected {
      border-color: var(--charcoal);
      background: var(--cream);
    }

    .msq-card.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: var(--border);
      background: var(--stone);
    }

    /* Custom Radio Dot */
    .radio-dot {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.18s;
      background: #fff;
      margin-top: 2px;
    }

    .msq-card.selected .radio-dot {
      border-color: var(--charcoal);
    }

    .radio-dot-inner {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--charcoal);
      opacity: 0;
      transition: opacity 0.18s;
    }

    .msq-card.selected .radio-dot-inner {
      opacity: 1;
    }

    /* Custom Checkbox Square */
    .check-box {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.18s, background 0.18s;
      background: #fff;
      margin-top: 2px;
    }

    .msq-card.selected .check-box {
      background: var(--charcoal);
      border-color: var(--charcoal);
    }

    .check-icon {
      color: #fff;
      width: 13px;
      height: 13px;
      opacity: 0;
      transition: opacity 0.18s;
    }

    .msq-card.selected .check-icon {
      opacity: 1;
    }

    /* ── Progress Bar ─────────────────────────────────────────────── */
    .progress-track {
      height: 4px;
      background: var(--sand);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--charcoal);
      border-radius: 99px;
      transition: width 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    /* ── Form Inputs ──────────────────────────────────────────────── */
    .form-input {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      color: var(--charcoal);
      background: var(--stone);
      outline: none;
      transition: border-color 0.18s;
      -webkit-appearance: none;
      appearance: none;
    }

    .form-input:focus {
      border-color: var(--charcoal);
    }

    .form-input::placeholder {
      color: var(--muted);
    }

    textarea.form-input {
      resize: vertical;
      min-height: 140px;
      font-family: inherit;
      line-height: 1.6;
    }

    /* ── Buttons ──────────────────────────────────────────────────── */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--charcoal);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.18s, transform 0.12s, box-shadow 0.18s, opacity 0.18s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      flex: 1 1 auto;
      text-align: center;
    }

    .btn-primary:hover:not(:disabled) {
      background: #2d2d30;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      background: var(--muted);
      cursor: not-allowed;
      box-shadow: none;
      opacity: 0.5;
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: transparent;
      color: var(--ink);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 13px 24px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s;
      flex: 1 1 auto;
    }

    .btn-ghost:hover {
      border-color: var(--ink);
      background: var(--cream);
    }

    /* ── Miscellanous ─────────────────────────────────────────────── */
    .tts-active {
      background: #FEF3C7 !important;
      color: #92400E !important;
    }

    .limit-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
    }

    .limit-badge.reached {
      color: var(--amber);
      border-color: var(--amber);
      background: var(--amber-lt);
    }

    .error-highlight {
      border-left: 4px solid #EF4444 !important;
      background: #FEF2F2 !important;
      border-radius: 12px;
      padding: 16px;
      margin-left: -16px;
      margin-right: -16px;
      width: calc(100% + 32px) !important;
    }

    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--sand);
      border-radius: 99px;
    }

    [data-lucide] {
      display: inline-block;
    }
  </style>
</head>

    /* ════════════════════════════════════════════════════════════════
       APP STATE & HELPERS

    const state = {
      screen: 'welcome',
      sectionIndex: 0,
      globalLang: 'en',
      answers: {},
      shuffled: {},
      ttsState: 'stopped',
      ttsQuestionId: null
    };

    const TOTAL_SECTIONS = SURVEY_SECTIONS.length;

    function initIcons() { if (window.lucide) lucide.createIcons(); }

    function shuffleArray(array) {
      let cur = array.length, rand;
      while (cur !== 0) {
        rand = Math.floor(Math.random() * cur);
        cur--;
        [array[cur], array[rand]] = [array[rand], array[cur]];
      }
      return array;
    }

    /* ── Form Validation ── */
    function validateCurrentSection() {
      const section = SURVEY_SECTIONS[state.sectionIndex];
      let isValid = true;
      let firstInvalidId = null;

      section.questions.forEach(q => {
        if (q.required === false) return; // Skip optional questions

        let valid = false;
        if (q.type === 'text' || q.type === 'textarea') {
          valid = state.answers[q.id] && state.answers[q.id].trim() !== '';
        } else if (q.type === 'radio' || q.type === 'consent') {
          valid = state.answers[q.id] !== undefined && state.answers[q.id] !== null && state.answers[q.id] !== false;
        } else if (q.type === 'checkbox' || q.type === 'limit-checkbox') {
          valid = state.answers[q.id] && state.answers[q.id].length > 0;
        }

        const block = document.getElementById('qblock-' + q.id);
        if (!valid) {
          isValid = false;
          if (!firstInvalidId) firstInvalidId = q.id;
          if (block) block.classList.add('error-highlight');
        } else {
          if (block) block.classList.remove('error-highlight');
        }
      });

      if (!isValid && firstInvalidId) {
        const block = document.getElementById('qblock-' + firstInvalidId);
        if (block) block.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      return isValid;
    }

    /* ── TTS Engine ── */
    function toggleTTS(text, lang, qId) {
      if (!('speechSynthesis' in window)) return;
      const synth = window.speechSynthesis;
      if (state.ttsQuestionId !== qId) { synth.cancel(); state.ttsState = 'stopped'; }

      if (state.ttsState === 'stopped') {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang === 'te' ? 'te-IN' : 'en-IN'; utter.rate = 0.9;
        utter.onend = () => { state.ttsState = 'stopped'; state.ttsQuestionId = null; updateAllTTSButtons(); };
        utter.onerror = () => { state.ttsState = 'stopped'; state.ttsQuestionId = null; updateAllTTSButtons(); };
        synth.speak(utter); state.ttsState = 'playing'; state.ttsQuestionId = qId;
      }
      else if (state.ttsState === 'playing') { synth.pause(); state.ttsState = 'paused'; }
      else if (state.ttsState === 'paused') { synth.resume(); state.ttsState = 'playing'; }
      updateAllTTSButtons();
    }

    function updateAllTTSButtons() {
      document.querySelectorAll('.tts-btn').forEach(btn => {
        const qId = btn.dataset.qid;
        if (state.ttsQuestionId === qId) {
          btn.classList.add('tts-active');
          btn.innerHTML = `<i data-lucide="${state.ttsState === 'playing' ? 'pause' : 'play'}" style="width:14px;height:14px;"></i>`;
        } else {
          btn.classList.remove('tts-active');
          btn.innerHTML = `<i data-lucide="volume-2" style="width:14px;height:14px;"></i>`;
        }
      });
      initIcons();
    }
    function stopAllAudio() { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); state.ttsState = 'stopped'; state.ttsQuestionId = null; }

    const app = document.getElementById('app');

    function render() {
      app.innerHTML = '';
      const wrapper = document.createElement('div');
      wrapper.className = 'screen w-full max-w-2xl mx-auto';

      if (state.screen === 'welcome') wrapper.innerHTML = renderWelcome();
      else if (state.screen === 'survey') wrapper.innerHTML = renderSurveySection();
      else if (state.screen === 'done') wrapper.innerHTML = renderDone();

      app.appendChild(wrapper);
      initIcons();
      updateAllTTSButtons();
      attachEventListeners();
    }

        <div class="px-5 py-6 md:p-6 bg-[var(--stone)] border-t border-[var(--border)] rounded-b-[20px] flex justify-between items-center gap-4 flex-wrap-reverse">
          <button class="btn-ghost" id="btn-back" ${isFirst ? 'style="display:none;"' : ''}>
            <i data-lucide="arrow-left" style="width:16px;height:16px;"></i> ${isTe ? 'వెనక్కి' : 'Back'}
          </button>
          <button class="btn-primary" id="btn-next" ${isSubmitDisabled ? 'disabled' : ''} style="max-width: 100%;">
            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${nextBtnText}</span>
            <i data-lucide="${isLast ? 'check-circle' : 'arrow-right'}" style="width:16px;height:16px; flex-shrink:0;"></i>
          </button>
        </div>
      </div>
    `;
    }

    function renderActionBar(q, lang, data, qNum) {
      const isTe = lang === 'te';
      
      // Dynamic Contextual Voice Script
      let typeInstruction = '';
      if (q.type === 'text' || q.type === 'textarea') typeInstruction = isTe ? 'దయచేసి మీ సమాధానాన్ని టైప్ చేయండి.' : 'Please type your answer.';
      else if (q.type === 'radio') typeInstruction = isTe ? 'ఒక ఎంపికను ఎంచుకోండి.' : 'Please select one option.';
      else if (q.type === 'checkbox' || q.type === 'limit-checkbox') typeInstruction = isTe ? 'వర్తించే అన్ని ఎంపికలను ఎంచుకోండి.' : 'Please select all that apply.';
      else if (q.type === 'consent') typeInstruction = isTe ? 'అంగీకరించడానికి ఎంచుకోండి.' : 'Check to agree.';

      let readText = `${isTe ? 'ప్రశ్న' : 'Question'} ${qNum || ''}. ${data.question}. ${typeInstruction}`;
      if (data.options) {
        readText += ' ' + data.options.join('. ');
      }

      return `
      <div style="display:flex;align-items:center;justify-content:flex-end;margin-bottom:8px;">
        <div class="action-bar">
          <button class="ab-btn tts-btn" data-qid="${q.id}" data-lang="${lang}" data-text="${encodeURIComponent(readText)}" title="${isTe ? 'చదివించు' : 'Read aloud'}">
            <i data-lucide="volume-2" style="width:14px;height:14px;"></i>
          </button>
          ${data.tooltip ? `
          <span class="ab-divider"></span>
          <div class="tooltip-wrap">
            <button class="ab-btn" title="${isTe ? 'సహాయం' : 'Help'}"><i data-lucide="info" style="width:14px;height:14px;"></i></button>
            <div class="tooltip-box">${data.tooltip}</div>
          </div>
          ` : ''}
        </div>
      </div>
    `;
    }

    /* ── Question Bodies ── */
    function getQuestionTitleHtml(q, data, qNum, isMSQ = false, isTe = false) {
      const reqMarkup = q.required !== false ? `<span class="text-red-500 ml-1 font-bold">*</span>` : '';
      const msqBadge = isMSQ ? `<div class="mt-1 mb-4 text-[11px] font-bold uppercase tracking-wider text-amber-600">${isTe ? 'బహుళ ఎంపికలు సాధ్యమే' : 'Multiple Selection Possible'}</div>` : '';
      return `
        <p style="font-size:16px;font-weight:600;color:var(--charcoal);margin-bottom:${isMSQ ? '4px' : '16px'};">
          <span style="color:var(--muted); margin-right:4px;">${qNum}.</span> ${data.question} ${reqMarkup}
        </p>
        ${msqBadge}
      `;
    }

    function renderTextBody(q, data, qNum) {
      const saved = state.answers[q.id] || '';
      // HTML Sanitization to prevent wiping text inputs if user types quotes or brackets
      const safeSaved = String(saved).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const isTextarea = q.type === 'textarea';
      return `
      ${getQuestionTitleHtml(q, data, qNum)}
      ${isTextarea 
        ? `<textarea class="form-input textarea-answer" data-qid="${q.id}" placeholder="${data.placeholder}">${safeSaved}</textarea>`
        : `<input type="text" class="form-input text-answer" data-qid="${q.id}" placeholder="${data.placeholder}" value="${safeSaved}" />`
      }
    `;
    }

    function renderRadioBody(q, data, qNum, displayIndices) {
      const selected = state.answers[q.id] || null;
      const options = displayIndices.map(i => `
      <div class="msq-card ${selected === i ? 'selected' : ''}" data-qid="${q.id}" data-val="${i}">
        <div class="radio-dot"><div class="radio-dot-inner"></div></div>
        <span>${data.options[i]}</span>
      </div>
    `).join('');
      return `${getQuestionTitleHtml(q, data, qNum)} <div style="display:flex;flex-direction:column;gap:12px;">${options}</div>`;
    }

    function renderCheckboxBody(q, data, qNum, displayIndices, isTe) {
      const selected = state.answers[q.id] || [];
      const options = displayIndices.map(i => `
      <div class="msq-card ${selected.includes(i) ? 'selected' : ''}" data-qid="${q.id}" data-val="${i}">
        <div class="check-box"><i data-lucide="check" class="check-icon"></i></div>
        <span>${data.options[i]}</span>
      </div>
    `).join('');
      return `${getQuestionTitleHtml(q, data, qNum, true, isTe)} <div style="display:flex;flex-direction:column;gap:12px;">${options}</div>`;
    }

    function renderLimitCheckboxBody(q, data, qNum, displayIndices, isTe) {
      const selected = state.answers[q.id] || [];
      const max = q.max || 3;
      const reached = selected.length >= max;

      const options = displayIndices.map(i => {
        const isSel = selected.includes(i);
        return `
        <div class="msq-card ${isSel ? 'selected' : ''} ${reached && !isSel ? 'disabled' : ''}" data-qid="${q.id}" data-val="${i}" data-limit="true">
          <div class="check-box"><i data-lucide="check" class="check-icon"></i></div>
          <span>${data.options[i]}</span>
        </div>`;
      }).join('');

      const titleHtml = `
      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:4px; flex-wrap:wrap;">
        <p style="font-size:16px;font-weight:600;color:var(--charcoal); margin:0; flex: 1 1 100%;">
          <span style="color:var(--muted); margin-right:4px;">${qNum}.</span> ${data.question} <span class="text-red-500 ml-1 font-bold">*</span>
        </p>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:8px;">
        <div class="text-[11px] font-bold uppercase tracking-wider text-amber-600">${isTe ? `గరిష్టంగా ${max} ఎంపికలు` : `Select Up to ${max} Choices`}</div>
        <span class="limit-badge ${reached ? 'reached' : ''}" id="badge-${q.id}">
          <i data-lucide="${reached ? 'check' : 'pointer'}" style="width:13px;height:13px;"></i> ${selected.length} / ${max}
        </span>
      </div>`;

      return `${titleHtml} <div style="display:flex;flex-direction:column;gap:12px;">${options}</div>`;
    }

    function renderConsentBody(q, data, qNum) {
      const isChecked = !!state.answers[q.id];
      return `
      ${getQuestionTitleHtml(q, data, qNum)}
      <div class="msq-card ${isChecked ? 'selected' : ''} consent-card" data-qid="${q.id}" data-val="true">
        <div class="check-box"><i data-lucide="check" class="check-icon"></i></div>
        <span class="font-medium">${data.label}</span>
      </div>
      `;
    }

    /* ────────────────────────────────────────────────────────────────
       DONE SCREEN
    ──────────────────────────────────────────────────────────────── */
    function renderDone() {
      const isTe = state.globalLang === 'te';
      const wantsEmail = !!state.answers['q-optin'];

      const emailBox = wantsEmail ? `
        <div style="background-color: var(--cream); border: 1px solid var(--sand); padding: 16px 20px; border-radius: 12px; display: inline-block; max-width: 460px; text-align: left; box-shadow: 0 2px 8px rgba(0,0,0,0.02); margin-top: 16px;">
          <div style="display:flex; gap:12px; align-items: flex-start;">
            <div style="background:var(--amber-lt); color:var(--amber); padding:8px; border-radius:8px; flex-shrink:0;">
              <i data-lucide="mail" style="width:18px;height:18px;"></i>
            </div>
            <p style="color:var(--charcoal);font-size:14px;line-height:1.6;margin:0;">
              ${isTe
          ? 'మీ ప్రతిస్పందనల PDF కాపీ మీ ఇమెయిల్‌కు పంపబడింది.'
          : 'A PDF copy of your responses has been sent to your email.'}
            </p>
          </div>
        </div>
      ` : '';

      return `
      <div class="card p-6 md:p-12 text-center" style="min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;">
        
        <div style="width:100%; display:flex; flex-direction:column; align-items:center; gap:20px;">
          
          <div style="width:72px;height:72px;border-radius:50%;background:var(--cream);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);">
            <i data-lucide="sparkles" style="width:36px;height:36px;color:var(--amber);"></i>
          </div>
          
          <div style="width:100%; display:flex; justify-content:center;">
            <div style="width:48px;height:3px;background:var(--amber);border-radius:99px;"></div>
          </div>

        </div>
        <div>
          <h2 style="font-size:clamp(22px,4vw,30px);font-weight:700;color:var(--charcoal);margin-bottom:12px;">
            ${isTe ? 'మీ సమయానికి ధన్యవాదాలు!' : 'Thank you for your time!'}
          </h2>
          
          <p style="color:var(--muted);font-size:15px;line-height:1.7;max-width:440px;margin:0 auto;">
            ${isTe
          ? 'ఈ క్రియేటివ్ గైడెన్స్ టూల్‌కిట్‌ను మెరుగుపరచడంలో మీ అంతర్దృష్టులు మాకు చాలా విలువైనవి.'
          : 'Your insights are actively helping us shape a better creative guidance toolkit for the region.'}
          </p>
          
          ${emailBox}
        </div>

        <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px;">
          <span class="limit-badge"><i data-lucide="layers" style="width:12px;height:12px;"></i> 6 ${isTe ? 'విభాగాలు పూర్తి' : 'Sections Complete'}</span>
          <span class="limit-badge" style="color:var(--amber);border-color:var(--amber);background:var(--amber-lt);">
            <i data-lucide="star" style="width:12px;height:12px;"></i> ${isTe ? 'విజయవంతంగా ఆమోదించబడింది' : 'Successfully Submitted'}
          </span>
        </div>

        <button class="btn-ghost" id="btn-restart" style="margin-top:16px;">
          <i data-lucide="refresh-ccw" style="width:14px;height:14px;"></i> ${isTe ? 'మరొక ప్రతిస్పందనను సమర్పించండి' : 'Submit another response'}
        </button>
      </div>
    `;
    }

    /* ════════════════════════════════════════════════════════════════
       EVENT LISTENERS
    ════════════════════════════════════════════════════════════════ */
    function attachEventListeners() {

      // Welcome Screen Start Button
      const btnStart = document.getElementById('btn-start');
      if (btnStart) btnStart.addEventListener('click', () => { state.screen = 'survey'; state.sectionIndex = 0; render(); });

      // Done Screen Restart Button
      const btnRestart = document.getElementById('btn-restart');
      if (btnRestart) btnRestart.addEventListener('click', () => {
        stopAllAudio();

        // Completely wipe the state clean for the new user
        Object.assign(state, {
          screen: 'welcome',
          sectionIndex: 0,
          answers: {},
          shuffled: {},
          ttsState: 'stopped',
          ttsQuestionId: null
        });

        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // Nav Buttons
      const btnBack = document.getElementById('btn-back');
      if (btnBack) btnBack.addEventListener('click', () => {
        stopAllAudio();
        if (state.sectionIndex > 0) { state.sectionIndex--; render(); }
        // Quick scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      const btnNext = document.getElementById('btn-next');
      if (btnNext) btnNext.addEventListener('click', async () => {
        stopAllAudio();
        
        if (!validateCurrentSection()) {
           return; 
        }
        
        if (state.sectionIndex < TOTAL_SECTIONS - 1) { 
          state.sectionIndex++; 
          render(); 
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return; 
        }
        
        // 3. SUBMIT LOGIC (Last Page)
        const isTe = state.globalLang === 'te';
        const consentIdx = state.answers['q-consent']; // 0 is Yes, 1 is No
        
        if (consentIdx === 1) { // User clicked "No"
           showReasonModal(isTe, (reason) => {
               executeSubmission(reason);
           });
        } else { // User clicked "Yes"
           executeSubmission("-");
        }
      });

      // --- MODAL & SUBMISSION HELPERS ---
      function showReasonModal(isTe, onSubmit) {
         const overlay = document.createElement('div');
         overlay.className = 'fixed inset-0 z-50 flex items-center justify-center px-4 screen';
         overlay.style.backgroundColor = 'rgba(0,0,0,0.6)';
         overlay.style.backdropFilter = 'blur(4px)';
         overlay.innerHTML = `
           <div class="card w-full max-w-md p-6 md:p-8 shadow-2xl border border-[var(--border)]" style="background:var(--stone);">
             <h3 style="font-size:20px;font-weight:700;color:var(--charcoal);margin-bottom:8px;">
               ${isTe ? 'దయచేసి మాతో పంచుకోండి' : 'Help us understand'}
             </h3>
             <p style="font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:16px;">
               ${isTe ? 'మీరు సమ్మతిని ఎందుకు నిరాకరించారో తెలుసుకోవాలనుకుంటున్నాము. మీ అభిప్రాయం మాకు ముఖ్యమైనది.' : 'Could you briefly share why you chose not to consent? Your perspective helps us improve.'}
             </p>
             <textarea id="reason-input" class="form-input w-full mb-6" style="min-height:100px;" placeholder="${isTe ? 'మీ కారణాన్ని ఇక్కడ టైప్ చేయండి...' : 'Type your reason here...'}"></textarea>
             <div style="display:flex; gap:12px;">
               <button id="btn-cancel-modal" class="btn-ghost" style="flex:1;">${isTe ? 'రద్దు చేయి' : 'Cancel'}</button>
               <button id="btn-submit-modal" class="btn-primary" style="flex:1;">${isTe ? 'సమర్పించండి' : 'Submit Response'}</button>
             </div>
           </div>
         `;
         document.body.appendChild(overlay);

         document.getElementById('btn-cancel-modal').onclick = () => overlay.remove();
         document.getElementById('btn-submit-modal').onclick = () => {
           const reason = document.getElementById('reason-input').value.trim() || "No reason provided";
           overlay.remove();
           onSubmit(reason);
         };
      }

      async function executeSubmission(consentReason) {
        const isTe = state.globalLang === 'te';
        const btnNext = document.getElementById('btn-next');
        const originalText = btnNext.innerHTML;
        
        btnNext.innerHTML = `<i data-lucide="loader-2" class="animate-spin" style="width:16px;height:16px;animation:spin 1s linear infinite;"></i> ${isTe ? 'సమర్పిస్తున్నాము...' : 'Submitting...'}`;
        btnNext.style.pointerEvents = 'none';
        btnNext.style.opacity = '0.7';
        initIcons();

        const finalPayload = {};
        const wantsEmail = !!state.answers['q-optin'];

        SURVEY_SECTIONS.forEach(sec => {
          sec.questions.forEach(q => {
            if (q.type === 'consent') return; 
            if (q.id === 'q-optin') return;
            
            const qText = q.en.question; 
            let answer = "No Answer";
            
            if (q.type === 'text' || q.type === 'textarea') {
              answer = state.answers[q.id] || "No Answer";
            } else if (q.type === 'radio') {
              const sIdx = state.answers[q.id];
              if (sIdx !== undefined && sIdx !== null) answer = q.en.options[sIdx];
            } else if (q.type === 'checkbox' || q.type === 'limit-checkbox') {
              const sArr = state.answers[q.id] || [];
              if (sArr.length > 0) {
                // Map each answer to start with a bullet point 
                answer = sArr.map(idx => "• " + q.en.options[idx]).join("\n");
              }
            }
            
            if (q.id === 'q-email' && !wantsEmail) {
               finalPayload["Email Address (Opted Out of PDF)"] = answer;
            } else {
               finalPayload[qText] = answer;
            }
          });
        });

        // Add the extra column for the modal reason
        finalPayload["Consent Rejection Reason"] = consentReason;

        const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbyczxpzNk1Eop7RnutfYMAvWesnH9WpCTTYJyxhQAsEjFkqVVf-vzs2uY3xQSkgzoeXBw/exec"; 
        
        try {
          await fetch(GOOGLE_APP_URL, {
            method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(finalPayload)
          });
          state.screen = 'done'; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (error) {
          console.error("Submission failed", error);
          alert(isTe ? "ఏదో తప్పు జరిగింది. దయచేసి మళ్లీ ప్రయత్నించండి." : "Something went wrong. Please try again.");
          btnNext.innerHTML = originalText; btnNext.style.pointerEvents = 'auto'; btnNext.style.opacity = '1'; initIcons();
        }
      }

      // Global Language Toggle
      document.querySelectorAll('.global-lang-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          stopAllAudio(); state.globalLang = btn.dataset.lang; render();
        });
      });

      // TTS Toggle 
      document.querySelectorAll('.tts-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          toggleTTS(decodeURIComponent(btn.dataset.text), btn.dataset.lang, btn.dataset.qid);
        });
      });

      // Radio Selection
      document.querySelectorAll('.msq-card').forEach(card => {
        if (card.classList.contains('consent-card')) return;

        card.addEventListener('click', () => {
          const qId = card.dataset.qid;
          const val = parseInt(card.dataset.val, 10);
          const qObj = SURVEY_SECTIONS[state.sectionIndex].questions.find(q => q.id === qId);

          if (qObj.type === 'radio') {
            state.answers[qId] = val;
            document.querySelectorAll(`.msq-card[data-qid="${qId}"]`).forEach(c => c.classList.toggle('selected', parseInt(c.dataset.val, 10) === val));
            
            const block = document.getElementById('qblock-' + qId);
            if (block) block.classList.remove('error-highlight');

            // FIX: Dynamically evaluate Submit button state if we are on the last page
            if (state.sectionIndex === TOTAL_SECTIONS - 1) {
              const btnNext = document.getElementById('btn-next');
              const consentVal = state.answers['q-consent'];
              if (btnNext) btnNext.disabled = (consentVal === undefined || consentVal === null);
            }
          }
          else if (qObj.type === 'checkbox' || qObj.type === 'limit-checkbox') {
            if (card.classList.contains('disabled')) return;
            if (!state.answers[qId]) state.answers[qId] = [];
            const arr = state.answers[qId];
            const idx = arr.indexOf(val);
            const max = qObj.max || 99;

            if (idx === -1) { if (arr.length >= max) return; arr.push(val); }
            else { arr.splice(idx, 1); }

            const reached = qObj.type === 'limit-checkbox' && arr.length >= max;
            document.querySelectorAll(`.msq-card[data-qid="${qId}"]`).forEach(c => {
              const v = parseInt(c.dataset.val, 10);
              const sel = arr.includes(v);
              c.classList.toggle('selected', sel);
              if (qObj.type === 'limit-checkbox') c.classList.toggle('disabled', reached && !sel);
            });

            if (qObj.type === 'limit-checkbox') {
              const badge = document.getElementById(`badge-${qId}`);
              if (badge) {
                badge.innerHTML = `<i data-lucide="${reached ? 'check' : 'pointer'}" style="width:13px;height:13px;display:inline-block;"></i> ${arr.length} / ${max}`;
                badge.classList.toggle('reached', reached);
                initIcons();
              }
            }
            const block = document.getElementById('qblock-' + qId);
            if (block && arr.length > 0) block.classList.remove('error-highlight');
          }
        });
      });

      // Consent Checkbox Selection (For the Email Opt-In)
      document.querySelectorAll('.consent-card').forEach(card => {
        card.addEventListener('click', () => {
          const qId = card.dataset.qid;
          state.answers[qId] = !state.answers[qId];

          card.classList.toggle('selected', state.answers[qId]);

          // FIX: Safely evaluate the radio value so it doesn't break if "Yes" (0) is selected
          if (state.sectionIndex === TOTAL_SECTIONS - 1) {
            const btnNext = document.getElementById('btn-next');
            const consentVal = state.answers['q-consent'];
            if (btnNext) btnNext.disabled = (consentVal === undefined || consentVal === null);
          }
        });
      });

      // Text Input
      document.querySelectorAll('.text-answer, .textarea-answer').forEach(inp => {
        inp.addEventListener('input', () => {
          state.answers[inp.dataset.qid] = inp.value;
          if (inp.value.trim() !== '') {
            const block = document.getElementById('qblock-' + inp.dataset.qid);
            if (block) block.classList.remove('error-highlight');
          }
        });
      });

      // Tooltips
      document.querySelectorAll('.tooltip-wrap button').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const wrap = btn.closest('.tooltip-wrap');
          wrap.classList.toggle('active');
          document.querySelectorAll('.tooltip-wrap.active').forEach(w => { if (w !== wrap) w.classList.remove('active'); });
        });
      });
      document.addEventListener('click', () => { document.querySelectorAll('.tooltip-wrap.active').forEach(w => w.classList.remove('active')); });
    }

    /* ════════════════════════════════════════════════════════════════
       BOOTSTRAP
    ════════════════════════════════════════════════════════════════ */
    render();
  </script>
</body>

</html>
